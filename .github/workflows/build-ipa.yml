name: build-ipa

# 没有 Mac 也能出包：推到 GitHub，Actions 用免费的 macOS 机器编译，
# 产出「未签名 IPA」，下载后丢进全能签签名即可安装。
#
# 有两种用法，本文件都支持：
#   ① 仓库根目录只放一个 LRF_OTA_iOS.zip        ← 最省事，推荐
#   ② 把工程文件直接传上来（根目录有 project.yml）
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Locate the project
        run: |
          set -e
          if [ -f LRF_OTA_iOS.zip ]; then
            echo "::notice::Found LRF_OTA_iOS.zip, unpacking"
            rm -rf src && mkdir -p src
            unzip -oq LRF_OTA_iOS.zip -d src
          elif [ -f project.yml ]; then
            echo "::notice::Using the repository files directly"
            rm -rf src && mkdir -p src
            for f in *; do
              case "$f" in
                src|.github|LRF_OTA_iOS.zip) continue ;;
              esac
              cp -R "$f" src/
            done
          else
            echo "::error::Neither LRF_OTA_iOS.zip nor project.yml exists in the repository root"
            ls -la
            exit 1
          fi
          echo "--- src ---"
          ls -la src

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd src && xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          cd src
          xcodebuild -project LRFOTA.xcodeproj \
                     -scheme LRFOTA \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Package IPA
        run: |
          set -e
          APP="src/build/Build/Products/Release-iphoneos/LRFOTA.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Build product not found, listing candidates:"
            find src/build -maxdepth 6 -name "*.app" || true
            exit 1
          fi
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry LRFOTA_unsigned.ipa Payload
          ls -lh LRFOTA_unsigned.ipa
          echo "OK, ready for signing with 全能签"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LRFOTA-ipa
          path: LRFOTA_unsigned.ipa
          if-no-files-found: error
          retention-days: 90
